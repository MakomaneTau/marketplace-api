name: API CI

on:
  push:
    branches:
      - main
      - staging
      - "feature/**"

  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: Type Check, Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
