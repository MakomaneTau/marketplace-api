openapi: 3.1.0
info:
  title: Marketplace API
  version: 1.0.0
  description: API contract implemented independently from the marketplace web client.
servers:
  - url: http://localhost:4000
    description: Local Express server
paths:
  /api/health:
    get:
      summary: Check the Express process
      responses:
        "200":
          description: Express is running
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: marketplace-api }
  /api/v1/auth/me:
    get:
      summary: Return the authenticated Supabase user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/signup:
    post:
      summary: Create a buyer or seller account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201": { description: Account created }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { description: Email already registered }
  /api/v1/auth/login:
    post:
      summary: Exchange credentials for a Supabase session
      responses:
        "200": { description: Authenticated session }
        "401": { description: Invalid credentials }
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      responses:
        "200": { description: Refreshed session }
        "401": { description: Invalid refresh token }
  /api/v1/auth/logout:
    post:
      summary: Revoke the authenticated user's sessions
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/forgot-password:
    post:
      summary: Request password recovery
      responses:
        "202": { description: Enumeration-safe recovery response }
  /api/v1/auth/reset-password:
    post:
      summary: Set a password using a recovery access token
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Password updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/profile:
    get:
      summary: Return the authenticated marketplace profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Marketplace profile }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/verifications/seller:
    get:
      summary: Return the seller's latest verification state
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Verification state or null }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Seller account required }
    post:
      summary: Submit private seller verification images
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [selfie, sellerId]
              properties:
                selfie: { type: string, format: binary }
                sellerId: { type: string, format: binary }
      responses:
        "201": { description: Verification submitted }
        "400": { description: Missing, unsupported, oversized, or invalid image }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Seller account required }
        "409": { description: Verification is already pending }
  /api/v1/shops/{slug}:
    get:
      summary: Return an open public shop and pickup areas
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200": { description: Public shop }
        "404": { description: Shop not found }
  /api/v1/seller/shop:
    get:
      summary: Return the authenticated seller's shop
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Seller shop or null }
    post:
      summary: Create the seller's shop
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Shop created }
        "409": { description: Seller already has a shop }
    patch:
      summary: Update the seller's shop
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Shop updated }
  /api/v1/seller/shop/pickup-areas:
    put:
      summary: Atomically replace campus pickup areas
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Shop with updated pickup areas }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/seller/shop/logo:
    post:
      summary: Replace the public shop logo
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Shop with updated logo }
  /api/v1/seller/shop/banner:
    post:
      summary: Replace the public shop banner
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Shop with updated banner }
    patch:
      summary: Update user-managed profile fields
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Profile updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/products:
    get:
      summary: List publicly visible products
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: condition, schema: { type: string, enum: [new, like_new, good, fair] } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, price_asc, price_desc, most_viewed] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Paginated product collection with page metadata
    post:
      summary: Create a product in an owned seller shop
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Product created
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Seller role or shop ownership required
  /api/v1/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Return a publicly visible product
      responses:
        "200": { description: Product found }
        "404": { description: Product not found }
    patch:
      summary: Update an owned product
      security:
        - bearerAuth: []
      responses:
        "200": { description: Product updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Seller role or shop ownership required }
        "404": { description: Product not found }
    delete:
      summary: Delete an owned product
      security:
        - bearerAuth: []
      responses:
        "204": { description: Product deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Seller role or shop ownership required }
        "404": { description: Product not found }
  /api/v1/seller/products:
    get:
      summary: List the authenticated seller's complete inventory
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [draft, active, sold, paused] } }
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: condition, schema: { type: string, enum: [new, like_new, good, fair] } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, price_asc, price_desc, most_viewed] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated seller inventory }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Seller role required }
    post:
      summary: Create a draft product in the authenticated seller's shop
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Product created }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Seller shop not found }
  /api/v1/seller/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update an owned product without bypassing managed images
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Product updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Product not found }
    delete:
      summary: Delete an owned product and its managed images
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Product deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Product not found }
  /api/v1/seller/products/{id}/images:
    post:
      summary: Append one managed public product image
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200": { description: Product with appended image }
        "400": { description: Invalid image content or upload }
        "409": { description: Six-image limit reached }
  /api/v1/seller/products/{id}/images/{index}:
    delete:
      summary: Remove a managed product image by ordered index
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: index
          required: true
          schema: { type: integer, minimum: 0, maximum: 5 }
      responses:
        "200": { description: Product with the image removed }
        "404": { description: Product or image not found }
        "409": { description: Active product must retain an image }
  /api/v1/categories:
    get:
      summary: List product categories with active product counts
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: featured
          schema: { type: boolean }
      responses:
        "200": { description: Category collection }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/categories/{slug}:
    get:
      summary: Return a category by slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200": { description: Category found }
        "404": { description: Category not found }
  /api/v1/universities:
    get:
      summary: List universities with campus counts
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
      responses:
        "200": { description: University collection }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/universities/{slug}:
    get:
      summary: Return a university and its campuses
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200": { description: University found }
        "404": { description: University not found }
  /api/v1/universities/{slug}/campuses:
    get:
      summary: List campuses belonging to a university
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200": { description: University and campus collection }
        "404": { description: University not found }
components:
  parameters:
    Slug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing, malformed, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SignupRequest:
      type: object
      required: [firstName, lastName, email, password, role, isStudent]
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        role: { type: string, enum: [buyer, seller] }
        isStudent: { type: boolean }
        universitySlug: { type: string }
        studentNumber: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details:
              type: array
              items: { type: object }
